version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: order-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - order-agent-pgdata:/var/lib/postgresql/data

volumes:
  order-agent-pgdata:
