# Application Configuration
spring.application.name=order-agent-api
server.port=8081

# PostgreSQL Database Configuration (separate port from finance-tracker's Postgres to avoid clashing)
spring.datasource.url=jdbc:postgresql://localhost:5433/order_agent?serverTimezone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=order-agent-secret-key-change-this-in-production-environment-to-a-long-random-string
jwt.expiration=86400000

# Bootstrap admin account, created on first startup if no ADMIN user exists yet.
# Log in with these, then use POST /api/staff/users to create real staff/admin accounts.
admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:admin@order-agent.local}
admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:ChangeMe123!}

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.orderagent=DEBUG
logging.level.org.hibernate.SQL=DEBUG
