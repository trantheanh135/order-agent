server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Reached either via the path router (prefix already stripped) or directly on the
  # NodePort with the full /order-agent/ prefix - strip it here so both work.
  location /order-agent/ {
    rewrite ^/order-agent/(.*)$ /$1 last;
  }

  location / {
    try_files $uri /index.html;
  }
}
