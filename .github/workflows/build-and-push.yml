name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'backend_code/**'
      - '.github/workflows/build-and-push.yml'

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/order-agent-backend

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend_code
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  update-manifests:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/order-agent-manifests
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: manifests

      - name: Update backend image
        run: |
          cd manifests
          sed -i "s|image:.*order-agent-backend.*|image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" k8s/03-backend.yaml

      - name: Commit and push
        run: |
          cd manifests
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/03-backend.yaml
          git commit -m "Update backend image to ${{ github.sha }}" || echo "No changes"
          git push
