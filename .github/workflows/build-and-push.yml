name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'backend_code/**'
      - 'staff_frontend/**'
      - 'customer_frontend/**'
      - '.github/workflows/build-and-push.yml'

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/order-agent

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend_code
          - name: staff-frontend
            context: ./staff_frontend
          - name: customer-frontend
            context: ./customer_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/order-agent-manifests
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: manifests

      - name: Update image tags
        run: |
          cd manifests
          sed -i "s|image:.*order-agent-backend.*|image: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}|g" k8s/03-backend.yaml
          sed -i "s|image:.*order-agent-staff-frontend.*|image: ${{ env.IMAGE_PREFIX }}-staff-frontend:${{ github.sha }}|g" k8s/04-staff-frontend.yaml
          sed -i "s|image:.*order-agent-customer-frontend.*|image: ${{ env.IMAGE_PREFIX }}-customer-frontend:${{ github.sha }}|g" k8s/05-customer-frontend.yaml

      - name: Commit and push
        run: |
          cd manifests
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/
          git commit -m "Update images to ${{ github.sha }}" || echo "No changes"
          git push
